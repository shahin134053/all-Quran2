name: Build and Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java Development Kit (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to gradlew
        run: chmod +x android/gradlew

      - name: Generate Release Keystore
        run: |
          if [ ! -f android/app/release.keystore ]; then
            keytool -genkeypair -v \
              -keystore android/app/release.keystore \
              -alias alshahin_key \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "ShahinQuranSecure2026" \
              -keypass "ShahinQuranSecure2026" \
              -dname "CN=Al-Shahin Quran, OU=Mobile, O=Al-Shahin, L=Dhaka, ST=Dhaka, C=BD"
          fi

      - name: Build Signed Release APK and App Bundle
        run: |
          cd android
          ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Prepare APK and AAB for Release
        run: |
          mkdir -p release-output
          # Copy Release APK
          find android/app/build/outputs/apk/release -name "*.apk" -exec cp {} release-output/Al-Shahin-Quran-release.apk \;
          # Copy Release AAB for Google Play Store
          find android/app/build/outputs/bundle/release -name "*.aab" -exec cp {} release-output/Al-Shahin-Quran-release.aab \; || true
          ls -la release-output/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Al-Shahin-Quran-release-artifacts
          path: release-output/

      - name: Create GitHub Release and Publish APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v2.0.0
          name: "Al-Shahin Quran v2.0.0 (Official Signed Release & Play Store Bundle)"
          body: |
            ## 📱 Al-Shahin Quran Android App v2.0.0 (Official Signed Release)
            
            ### 📥 ডাউনলোড ও পাবলিশিং ফাইল:
            1. **`Al-Shahin-Quran-release.apk`**: সরাসরি অ্যান্ড্রয়েড ফোনে ইনস্টল করার জন্য অফিশিয়াল সাইনড রিলিজ APK (Direct Install)।
            2. **`Al-Shahin-Quran-release.aab`**: গুগল প্লে স্টোর (Google Play Console)-এ আপলোড ও পাবলিশ করার জন্য প্রস্তুত অফিসিয়াল অ্যান্ড্রয়েড অ্যাপ বান্ডেল (Android App Bundle)।
            
            ---
            
            ### 🌟 সংস্করণ ২.০ (Version 2.0) নতুন চমকপ্রদ ফিচারসমূহ:
            - 🕌 **হাইপার-লোকাল মসজিদ লোকেটর (Nearby Mosques):** লাইভ জিপিএস অটো-ডিটেকশন এবং নিকটবর্তী মসজিদের নিখুঁত দূরত্ব ও ডিরেকশন।
            - 📖 **সম্পূর্ণ কুরআন শরীফ (আল-কুরআন):** আন্তর্জাতিক মানের অফলাইন ক্যাশিং, উচ্চমানের অডিও তিলাওয়াত, বাংলা-ইংরেজি অনুবাদ ও তাফসির।
            - 🌙 **মাহে রমাদান হাব ও ক্যালেন্ডার:** লাইভ সেহরি ও ইফতার কাউন্টডাউন, রমাদানের দিনভিত্তিক সূচি ও বিশেষ দু'আ।
            - 🕌 **পবিত্র জুমার হাব:** সূরা আল-কাহাফ তিলাওয়াত, জুমার ৮টি সুন্নাত চেকলিস্ট ও বিশেষ দরূদ কাউন্টার।
            - 🤲 **হিসনুল মুসলিম ও দু'আ ভান্ডার:** প্রয়োজনীয় দৈনন্দিন দু'আসমূহ অর্থসহ।
            - 🎯 **খতম প্ল্যানার ও আসমাউল হুসনা:** ৩০ পারা খতম ট্র্যাকার ও আল্লাহর ৯৯টি গুণবাচক নাম।
            - 🧮 **যাকাত ক্যালকুলেটর ও ডিজিটাল তাসবিহ:** আধুনিক হিসাব ব্যবস্থা ও ফুল-স্ক্রিন তাসবিহ।
            - 🎨 **৬টি প্রিমিয়াম ইসলামিক থিম ও ডার্ক মোড:** চোখ-জুড়ানো ইন্টারফেস ও মসৃণ অভিজ্ঞতা।
            
            ---
            
            ### 🛡️ গুগল প্লে প্রোটেক্ট (Play Protect) নোটিশ সংক্রান্ত তথ্য:
            - **কারণ:** অ্যাপটি প্লে স্টোরের বাইরে সরাসরি ফাইল থেকে ইনস্টল করার সময় অ্যান্ড্রয়েড সিস্টেম "Unrecognized Developer" নোটিশ প্রদর্শন করতে পারে।
            - **ইনস্টল পদ্ধতি:** স্ক্রিনে আসলে **"More details" (বা বিস্তারিত)**-এ চাপ দিন এবং **"Install anyway" (বা তবুও ইনস্টল করুন)** নির্বাচন করুন। অ্যাপটি শতভাগ নিরাপদ ও সাইনড করা।
          draft: false
          prerelease: false
          make_latest: true
          files: |
            release-output/Al-Shahin-Quran-release.apk
            release-output/Al-Shahin-Quran-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
